    .observation-row{display:flex;gap:11px;justify-content:space-between;border-bottom:1px solid #294154;padding:6px 0;font-size:.78rem;line-height:1.38}
    .observation-row:last-child{border-bottom:0}.observation-key{color:#91afc3;flex:1}.observation-value{color:#e5f2fa;flex:1.1;text-align:right;font-weight:630}
    .observation-notes{font-size:.76rem;line-height:1.6;color:#c5d8e8;margin-top:12px}
    .assessment-heading{font-size:.72rem;letter-spacing:.1em;font-weight:850;color:#8ed5e2;text-transform:uppercase;margin:18px 0 10px}
    .mini-step{height:34px;min-width:34px;border-radius:9px;border:1px solid #334a60;background:#14283b;color:#8da8bc;font-size:.77rem;font-weight:850;display:grid;place-items:center}
    .mini-step.current{border-color:#82e5dd;color:#062832;background:#82e5dd}.mini-step.completed{border-color:#396a67;background:#1b4846;color:#98e9d3}.mini-step.missed{border-color:#7a5060;background:#432938;color:#ffc2c1}
    .result-ring{width:150px;height:150px;display:grid;place-items:center;border-radius:50%;margin:0 auto 22px;position:relative;background:conic-gradient(#6de0c8 var(--percent),#243d51 0)}
    .result-ring:before{content:'';inset:11px;position:absolute;border-radius:50%;background:#122437}
    .ring-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;flex-direction:column}
    .ring-score{font-size:2.6rem;line-height:1;font-weight:850;letter-spacing:-.06em}
    .ring-label{font-size:.7rem;letter-spacing:.12em;color:#a5bacb;font-weight:850;margin-top:5px}
    .footer-note{color:#7893a9;font-size:.72rem;line-height:1.55}
    .transition-in{animation:show-in .23s ease-out both}
    @keyframes show-in{from{opacity:.1;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){.header-tag{display:none}.panel{border-radius:21px}.question-panel{padding:21px 17px}.choice{padding:13px 12px;gap:10px}.choice .letter{min-width:31px;height:31px}.choice .choice-text{font-size:.91rem}.result-ring{width:133px;height:133px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

  <footer class="shell pb-8 pt-3"><div class="footer-note">Practice material from the supplied Chapter 28 test bank. Educational use only; follow current clinical protocols and instructor guidance for patient care.</div></footer>
  <script id="question-bank" type="application/json">[{"id": 1, "sourcePage": 1, "type": "single", "stem": "A nurse assesses a client’s electrocardiograph tracing and observes that not all QRS complexes are preceded by a P wave. How would the nurse interpret this observation?", "options": [{"id": "A", "text": "The client has hyperkalemia causing irregular QRS complexes."}, {"id": "B", "text": "Ventricular tachycardia is overriding the normal atrial rhythm."}, {"id": "C", "text": "The client’s chest leads are not making sufficient contact with the skin."}, {"id": "D", "text": "Ventricular and atrial depolarizations are initiated from different sites."}], "correct": ["D"], "rationale": "Normal rhythm shows one P wave preceding each QRS complex, indicating that all depolarization is initiated at the sinoatrial node. QRS complexes without a P wave indicate a different source of initiation of depolarization. This finding on an electrocardiograph tracing is not an indication of hyperkalemia, ventricular tachycardia, or disconnection of leads."}, {"id": 2, "sourcePage": 1, "type": "single", "stem": "A nurse cares for a client who has a heart rate averaging 56 beats/min with no adverse symptoms. Which activity modification would the nurse suggest to avoid further slowing of the heart rate?", "options": [{"id": "A", "text": "“Make certain that your bath water is warm.”"}, {"id": "B", "text": "“Avoid straining while having a bowel movement.”"}, {"id": "C", "text": "“Limit your intake of caffeinated drinks to one a day.”"}, {"id": "D", "text": "“Avoid strenuous exercise such as running.”"}], "correct": ["B"], "rationale": "Bearing down strenuously during a bowel movement is one type of Valsalva maneuver, which stimulates the vagus nerve and results in slowing of the heart rate. Such a response is not desirable in a person who has bradycardia. The other instructions are not appropriate for this condition."}, {"id": 3, "sourcePage": 2, "type": "single", "stem": "A nurse is assessing Patients on a medical-surgical unit. Which client would the nurse identify as being at greatest risk for atrial fibrillation?", "options": [{"id": "A", "text": "A 45-year-old who takes an aspirin daily."}, {"id": "B", "text": "A 50-year-old who is post coronary artery bypass graft surgery."}, {"id": "C", "text": "A 78-year-old who had a carotid endarterectomy."}, {"id": "D", "text": "An 80-year-old with chronic obstructive pulmonary disease."}], "correct": ["B"], "rationale": "Atrial fibrillation occurs commonly in Patients with cardiac disease. Other risk factors include hypertension (HTN), previous ischemic stroke, transient ischemic attack (TIA) or other thromboembolic event, diabetes mellitus, heart failure, obesity, hyperthyroidism, chronic kidney disease, excessive alcohol use, and mitral valve disease. The other conditions do not place these Patients at higher risk for atrial fibrillation."}, {"id": 4, "sourcePage": 2, "type": "single", "stem": "A nurse assesses a client with atrial fibrillation. Which manifestation would alert the nurse to the possibility of a serious complication from this condition?", "options": [{"id": "A", "text": "Sinus tachycardia"}, {"id": "B", "text": "Speech alterations"}, {"id": "C", "text": "Fatigue"}, {"id": "D", "text": "Dyspnea with activity"}], "correct": ["B"], "rationale": "Patients with atrial fibrillation are at risk for embolic stroke. Evidence of embolic events includes changes in mentation, speech, sensory function, and motor function. Patients with atrial fibrillation often have a rapid ventricular response as a result. Fatigue is a nonspecific complaint. Patients with atrial fibrillation often have dyspnea as a result of the decreased cardiac output caused by the rhythm disturbance."}, {"id": 5, "sourcePage": 2, "type": "single", "stem": "A nurse evaluates prescriptions for a client with chronic atrial fibrillation. Which medication would the nurse expect to find on this client’s medication administration record to prevent a common complication of this condition?", "options": [{"id": "A", "text": "Sotalol"}, {"id": "B", "text": "Warfarin"}, {"id": "C", "text": "Atropine"}, {"id": "D", "text": "Lidocaine"}], "correct": ["B"], "rationale": "Atrial fibrillation puts Patients at risk for developing emboli. Patients at risk for emboli are treated with anticoagulants, such as heparin, enoxaparin, or warfarin. Sotalol, atropine, and lidocaine are not appropriate for preventing this complication."}, {"id": 6, "sourcePage": 3, "type": "single", "stem": "A nurse administers prescribed adenosine to a client. Which response would the nurse assess for as the expected therapeutic response?", "options": [{"id": "A", "text": "Decreased intraocular pressure"}, {"id": "B", "text": "Increased heart rate"}, {"id": "C", "text": "Short period of asystole"}, {"id": "D", "text": "Hypertensive crisis"}], "correct": ["C"], "rationale": "Patients usually respond to adenosine with a short period of asystole, bradycardia with long pauses, nausea, or vomiting. Adenosine has no impact on intraocular pressure nor does it cause increased heart rate or hypertensive crisis."}, {"id": 7, "sourcePage": 3, "type": "single", "stem": "A telemetry nurse assesses a client who has a heart rate of 35 beats/min on the cardiac monitor. Which assessment would the nurse complete next?", "options": [{"id": "A", "text": "Pulmonary auscultation"}, {"id": "B", "text": "Pulse strength and amplitude"}, {"id": "C", "text": "Level of consciousness"}, {"id": "D", "text": "Mobility and gait stability"}], "correct": ["C"], "rationale": "A heart rate of 40 beats/min or less could have hemodynamic consequences. The client is at risk for inadequate cerebral perfusion. The nurse would assess for level of consciousness, dizziness, confusion, syncope, chest pain, shortness of breath. Although the other assessments would be completed, the nurse would assess the client’s neurologic status next."}, {"id": 8, "sourcePage": 3, "type": "single", "stem": "A nurse cares for a client with an intravenous temporary pacemaker for bradycardia. The nurse observes the presence of a pacing spike but no QRS complex on the client’s electrocardiogram. What action would the nurse take next?", "options": [{"id": "A", "text": "Administer intravenous diltiazem."}, {"id": "B", "text": "Assess vital signs and level of consciousness."}, {"id": "C", "text": "Administer sublingual nitroglycerin."}, {"id": "D", "text": "Assess capillary refill and temperature."}], "correct": ["B"], "rationale": "In temporary pacing, the wires are threaded onto the epicardial surface of the heart and exit through the chest wall. The pacemaker spike would be followed immediately by a QRS complex. Pacing spikes seen without subsequent QRS complexes imply loss of capture. If there is no capture, then there is no ventricular depolarization and contraction. The nurse would assess for cardiac output via vital signs and level of consciousness. The other interventions would not determine if the client is tolerating the loss of capture."}, {"id": 9, "sourcePage": 4, "type": "single", "stem": "A nurse prepares to defibrillate a client who is in ventricular fibrillation. Which intervention is appropriate for the nurse to perform prior to defibrillating this client?", "options": [{"id": "A", "text": "Make sure that the defibrillator is set to the synchronous mode."}, {"id": "B", "text": "Administer 1 mg of intravenous epinephrine."}, {"id": "C", "text": "Test the equipment by delivering a smaller shock at 100 J."}, {"id": "D", "text": "Ensure that everyone is clear of contact with the client and the bed."}], "correct": ["D"], "rationale": "To avoid injury, the rescuer commands that all personnel clear contact with the client or the bed and ensures their compliance before delivery of the shock. Defibrillation is done in asynchronous mode. Equipment would not be tested before a client is defibrillated because this is an emergency procedure; equipment would be checked on a routine basis. Defibrillation takes priority over any medications."}, {"id": 10, "sourcePage": 4, "type": "single", "stem": "After teaching a client who has an implantable cardioverter-defibrillator (ICD), a nurse assesses the client’s understanding. Which statement by the client indicates correct understanding of the teaching?", "options": [{"id": "A", "text": "“I would wear a snug-fitting shirt over the ICD.”"}, {"id": "B", "text": "“I will avoid sources of strong electromagnetic fields.”"}, {"id": "C", "text": "“I would participate in a strenuous exercise program.”"}, {"id": "D", "text": "“Now I can discontinue my antidysrhythmic medication.”"}], "correct": ["B"], "rationale": "The client being discharged with an ICD is instructed to avoid strong sources of electromagnetic fields, such as devices emitting microwaves (not microwave ovens); transformers; radio, television, and radar transmitters; large electrical generators; metal detectors, including handheld security devices at airports; antitheft devices; arc welding equipment; and sources of 60-cycle (Hz) interference. Also avoid leaning directly over the alternator of a running motor of a car or boat. Patients would avoid tight clothing, which could cause irritation over the ICD generator. The client would be encouraged to exercise but would not engage in strenuous activities that cause the heart rate to meet or exceed the ICD cutoff point because the ICD can discharge inappropriately. The client would continue all prescribed medications."}, {"id": 11, "sourcePage": 5, "type": "single", "stem": "A nurse cares for a client with atrial fibrillation who reports fatigue when completing activities of daily living. What intervention would the nurse implement to address this client’s concerns?", "options": [{"id": "A", "text": "Administer oxygen therapy at 2 L per nasal cannula."}, {"id": "B", "text": "Provide the client with a sleeping pill to stimulate rest."}, {"id": "C", "text": "Schedule periods of exercise and rest during the day."}, {"id": "D", "text": "Ask assistive personnel (AP) to help bathe the client."}], "correct": ["C"], "rationale": "Patients who have atrial fibrillation are at risk for decreased cardiac output and fatigue when completing activities of daily living. The nurse would schedule periods of exercise and rest during the day to decrease fatigue. The other interventions will not assist the client with performing self-care activities and there is no indication for oxygen."}, {"id": 12, "sourcePage": 5, "type": "single", "stem": "A nurse assists with the cardioversion of a client experiencing acute atrial fibrillation. What action would the nurse take prior to the cardioversion?", "options": [{"id": "A", "text": "Administer intravenous adenosine."}, {"id": "B", "text": "Turn off oxygen therapy."}, {"id": "C", "text": "Ensure that a tongue blade is available."}, {"id": "D", "text": "Position the client on the left side."}], "correct": ["B"], "rationale": "For safety during cardioversion, the nurse would turn off any oxygen therapy to prevent fire. The other interventions are not appropriate for a cardioversion. The client would be placed in a supine position."}, {"id": 13, "sourcePage": 5, "type": "single", "stem": "A nurse prepares to discharge a client with a cardiac dysrhythmia who is prescribed home health care services. Which priority information would be communicated to the home health nurse upon discharge?", "options": [{"id": "A", "text": "Medication orders for home"}, {"id": "B", "text": "Immunization history"}, {"id": "C", "text": "Religious beliefs"}, {"id": "D", "text": "Nutrition preferences"}], "correct": ["A"], "rationale": "The home health nurse needs to know current medications the client is taking to ensure assessment, evaluation, and further education related to these medications. The other information might be used to plan care, but not as the priority."}, {"id": 14, "sourcePage": 6, "type": "single", "stem": "A nurse assesses a client with tachycardia. Which clinical manifestation requires immediate intervention by the nurse?", "options": [{"id": "A", "text": "Midsternal chest pain"}, {"id": "B", "text": "Increased urine output"}, {"id": "C", "text": "Mild orthostatic hypotension"}, {"id": "D", "text": "P wave touching the T wave"}], "correct": ["A"], "rationale": "Chest pain, possibly angina, indicates that tachycardia may be increasing the client’s myocardial workload and oxygen demand to such an extent that normal oxygen delivery cannot keep pace. This results in myocardial hypoxia and pain. Increased urinary output and mild orthostatic hypotension are not life-threatening conditions and therefore do not require immediate intervention. The P wave touching the T wave indicates significant tachycardia and would be assessed to determine the underlying rhythm and cause; this is an important assessment but is not as critical as chest pain, which indicates cardiac cell death."}, {"id": 15, "sourcePage": 6, "type": "single", "stem": "A nurse teaches a client who experiences occasional premature atrial contractions (PACs) accompanied by palpitations that resolve spontaneously without treatment. Which statement would the nurse include in this client’s teaching?", "options": [{"id": "A", "text": "“Minimize or abstain from caffeine.”"}, {"id": "B", "text": "“Lie on your side until the attack subsides.”"}, {"id": "C", "text": "“Use your oxygen when you experience PACs.”"}, {"id": "D", "text": "“Take amiodarone daily to prevent PACs.”"}], "correct": ["A"], "rationale": "PACs usually have no hemodynamic consequences. For a client experiencing infrequent PACs, the nurse would explore possible lifestyle causes, such as excessive caffeine intake and stress. Lying on the side will not prevent or resolve PACs. Oxygen is not necessary. Although medications may be needed to control symptomatic dysrhythmias, for infrequent PACs, the client first would try lifestyle changes to control them."}, {"id": 16, "sourcePage": 6, "type": "single", "stem": "The nurse asks a client who has experienced ventricular dysrhythmias about substance abuse. The client asks, “Why do you want to know if I use cocaine?” What is the nurse’s best response?", "options": [{"id": "A", "text": "“Substance abuse puts Patients at risk for many health issues.”"}, {"id": "B", "text": "“The hospital requires that I ask you about cocaine use.”"}, {"id": "C", "text": "“Patients who use cocaine are at risk for fatal dysrhythmias.”"}, {"id": "D", "text": "“We can provide services for cessation of substance abuse.”"}], "correct": ["C"], "rationale": "Patients who use cocaine or illicit inhalants are particularly at risk for potentially fatal dysrhythmias. The other responses do not adequately address the client’s question."}, {"id": 17, "sourcePage": 7, "type": "single", "stem": "A nurse supervises an assistive personnel (AP) applying electrocardiographic monitoring. Which statement would the nurse provide to the AP related to this procedure?", "options": [{"id": "A", "text": "“Clean the skin and clip hairs if needed.”"}, {"id": "B", "text": "“Add gel to the electrodes prior to applying them.”"}, {"id": "C", "text": "“Place the electrodes on the posterior chest.”"}, {"id": "D", "text": "“Turn off oxygen prior to monitoring the client.”"}], "correct": ["A"], "rationale": "To ensure the best signal transmission, the skin would be clean and hairs clipped. Electrodes would be placed on the anterior chest, and no additional gel is needed. Oxygen has no impact on electrocardiographic monitoring."}, {"id": 18, "sourcePage": 7, "type": "single", "stem": "A nurse assesses a client’s electrocardiogram (ECG) and observes the reading shown below: How would the nurse document this client’s ECG strip?", "options": [{"id": "A", "text": "Ventricular tachycardia"}, {"id": "B", "text": "Ventricular fibrillation"}, {"id": "C", "text": "Sinus rhythm with premature atrial contractions (PACs)"}, {"id": "D", "text": "Sinus rhythm with premature ventricular contractions (PVCs)"}], "correct": ["D"], "rationale": "Sinus rhythm with PVCs has an underlying regular sinus rhythm with ventricular depolarization that sometimes precede atrial depolarization. The PVC would exhibit as a widened QRS without a preceding p wave. Ventricular tachycardia and ventricular fibrillation rhythms would not have sinus beats present. Premature atrial contractions are atrial contractions initiated from another region of the atria before the sinus node initiates atrial depolarization.", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiYAAACbCAIAAADZZ8eTAAAACXBIWXMAAA7EAAAOxAGVKw4bAAEiSElEQVR4nNS9LZfsuLItuv/K+QkHbtqwYcNFCxZcsGjBggWTJjQ0NDUUFBQVFDTUk2NqTk9n9dn33Xf3G/u9HD2qczltWQqFQhFT8fGP/v+NT075++t7fFpr/+m+/Js/Y0SP7+9934/j+E/35d//GeNa1zWl9J/uyL//M3hyjK6U8p/uyL//k/M5tPH3P92Rf/9nrLIxZS0+/+m+/Js/56xt+/jvP92R/6PPP/C/MU+11vNvKePvOV21Yubm9fsHN9S4Z/6z6Rp+uF8s86nr5uv38+IQW8/HY3k+dcMRH3zBlRJ96yHEcZvuwT/70XER94jnzovx/bh/5k9+hdf19+V+kUt/9YoXyuqe0bdlWZ6P51jkL7/+/P63H91w3fm/fKRdj/zff9f/7qY4hvbx8fH+/j4m7n/rwf9ffL6+vt5+/fr9+/e/uMfJ6ywkHu7GRT+f/V/24X+6528bfHnqtWP2eT6fv379+vz8/Bdv1FM/v/xPHXvhtJeb/70q19/Sc3zGKhsTN5TXFzXo/9nb/8/7/D+N/W9W5f8sT8BXY9YGN45Z+9e76b+eBW9/sujxN+Lr/73PP9CVsX9+xGCGcByzNcY2/o6Zezwe4/san1NuPp9DYR8Xv+Iz/jkewZfHefmBB8eTa7TziM8wX9DU+T0an83GPWgWF8f30Q28AneeW1F80B/cj8fRDXVpNvJ9PjieOi9GC2gajy98NTrjTeFGDXP89VGPDUP9xK9P+8xuPB64f9u2NR5Xy/u2oUH0bVLy8Rh36l1bfPB9Oe9Y0EnducQHX5wy6CfoidbwLNrR0PA4/vn58YnhayzYFM8vducSjY8+73z7k1fUoHq+Lud1TPpJ/+hzTMRj4cf7rPf656Wf/pQoo+vo7cqPbsB7cYNIiiuwyfAP/DpJx8+4AWQ/x3XetvrjSzD8Qm4U36IRXcTq+Pr81CLCX70L86558Zk6OeRODXGR0x9LVWyMzzfX5oPLBOvovPj5Ob5t8aJz+jD78VdvVz/1UnXjxifxF0PQoHxFiJP9+sKpnpSMt6/iNLt+Xvl+PNly8Faw3OPpC0Rs70SY3H6y7vLyxvOnx3PIIk26iI8v6gYa0QA1hIvHjA6YTS3VxR6ZD9o/td5d4DzPsT60pvB3/BNklNDDi8DAam0jEdTJB9uh5Do5SnJPfI6hDe4U5/jSw1t8VaKRcf0aNamBfs7VtExqYODeyNhiABj8Q5vPV7x+bHej3aEgDAV23DS+jCvjSZgRuH4iRSFQxlPjERhD45+4ueSMe8YVfHlGX2ES5fh1XIFpAuv+fFdKJT5jy0nxffQej0AQDDtpvAu9GhLwbCql97e3 sess? (Select all that apply.)", "options": [{"id": "A", "text": "Decrease in cardiac output"}, {"id": "B", "text": "Increase in cardiac output"}, {"id": "C", "text": "Decrease in blood pressure"}, {"id": "D", "text": "Increase in blood pressure"}, {"id": "E", "text": "Decrease in urine output"}, {"id": "F", "text": "Increase in urine output"}], "correct": ["A", "C", "E"], "rationale": "Elevated heart rates in a healthy client initially cause blood pressure and cardiac output to increase. However, in a client who has congestive heart failure or a client with long-term tachycardia, ventricular filling time, cardiac output, and blood pressure eventually decrease. As cardiac output and blood pressure decrease, urine output will fall."}, {"id": 24, "sourcePage": 12, "type": "multi", "stem": "A nurse teaches a client with a new permanent pacemaker. Which instructions would the nurse include in this client’s teaching? (Select all that apply.)", "options": [{"id": "A", "text": "“Until your incision is healed, do not submerge your pacemaker. Only take showers.”"}, {"id": "B", "text": "“Report any pulse rates lower than your pacemaker settings.”"}, {"id": "C", "text": "“If you feel weak, apply pressure over your generator.”"}, {"id": "D", "text": "“Have your pacemaker turned off before having magnetic resonance imaging (MRI).”"}, {"id": "E", "text": "“Do not lift your left arm above the level of your shoulder for 8 weeks.”"}], "correct": ["A", "B", "E"], "rationale": "The client would not submerge in water until the site has healed; after the incision is healed, the client may take showers or baths without concern for the pacemaker. The client would be instructed to report changes in heart rate or rhythm, such as rates lower than the pacemaker setting or greater than 100 beats/min. The client would be advised of restrictions on physical activity for 8 weeks to allow the pacemaker to settle in place. The client would never apply pressure over the generator and would avoid tight clothing. The client would never have MRI because, whether turned on or off, the pacemaker contains metal. The client would be advised to inform all health care providers that he or she has a pacemaker."}, {"id": 25, "sourcePage": 13, "type": "multi", "stem": "A nurse is teaching a client who has premature ectopic beats. Which education would the nurse include in this client’s teaching? (Select all that apply.)", "options": [{"id": "A", "text": "Smoking cessation"}, {"id": "B", "text": "Stress reduction and management"}, {"id": "C", "text": "Avoiding vagal stimulation"}, {"id": "D", "text": "Adverse effects of medications"}, {"id": "E", "text": "Foods high in potassium"}, {"id": "F", "text": "Types of aerobic exercise"}], "correct": ["A", "B", "D"], "rationale": "A client who has premature beats or ectopic rhythms would be taught to stop smoking, manage stress, take medications as prescribed, and report adverse effects of medications. Patients with premature beats are not at risk for vasovagal attacks or potassium imbalances. While exercise is beneficial, aerobic exercise is not specifically linked to this client’s educational needs."}]</script>

    const score = () => [...store.results.values()].filter(v=>v.correct).length;
    const solved = () => store.results.size;
    const renderChips = () => `<div class="flex flex-wrap gap-1.5" aria-label="Question completion indicators">${store.order.map((q,i)=>{const r=submitted(q);const css=i===store.cursor?'current':r?(r.correct?'completed':'missed'):'';return `<span class="mini-step ${css}" title="Question ${i+1}${r?(r.correct?' correct':' missed'):' not answered'}" aria-current="${i===store.cursor?'step':'false'}">${i+1}</span>`;}).join('')}</div>`;
    const table = () => {
      const cells=[
        {t:'08:00 · PREVIOUS',v:[['Temperature','98° F (36.7° C)'],['Heart rate','68 beats/min'],['Blood pressure','135/60 mm Hg'],['Respiratory rate','14 breaths/min'],['O₂ saturation','96%'],['Oxygen therapy','2 L nasal cannula']],n:['Client alert and oriented.','Cardiac rhythm: normal sinus rhythm.','Skin warm and dry; appropriate for race.','Respirations equal and unlabored.','Denies shortness of breath and chest pain.']},
        {t:'10:00 · CURRENT',v:[['Temperature','98.2° F (36.8° C)'],['Heart rate','50 beats/min'],['Blood pressure','132/57 mm Hg'],['Respiratory rate','16 breaths/min'],['O₂ saturation','95%'],['Oxygen therapy','2 L nasal cannula']],n:['Client alert and oriented.','Cardiac rhythm: sinus bradycardia.','Skin warm and dry; appropriate for race.','Respirations equal and unlabored.','Denies shortness of breath and chest pain.','Voids 420 mL of clear yellow urine.']}
      ];
      return `<div class="mt-5"><div class="assessment-heading">Comparison of nursing assessments</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${cells.map(c=>`<div class="observation-card"><h3>${c.t}</h3>${c.v.map(x=>`<div class="observation-row"><span class="observation-key">${escaped(x[0])}</span><span class="observation-value">${escaped(x[1])}</span></div>`).join('')}<div class="observation-notes">${c.n.map(n=>`<div>• ${escaped(n)}</div>`).join('')}</div></div>`).join('')}</div></div>`;
    };
    function startScreen(){
      app.innerHTML=`<section class="panel p-6 sm:p-11 lg:p-14 transition-in"><div class="max-w-3xl">
        <div class="micro mb-5">NCLEX-STYLE • INTERACTIVE STUDY MODE</div>
        <h1 class="hero-heading">Read the rhythm.<br><span class="gradient-word">Know the response.</span></h1>
        <p class="soft-text text-base sm:text-lg leading-relaxed mt-6 max-w-2xl">Work through the complete Chapter 28 dysrhythmias test bank. Choose your answer, check it, and see the book’s full rationale before moving on.</p>
        <div class="grid grid-cols-3 gap-2 sm:gap-3 mt-9 max-w-2xl">
          <div class="stat-tile"><div class="stat-value">25</div><div class="stat-label">Questions</div></div>
          <div class="stat-tile"><div class="stat-value">3</div><div class="stat-label">Select all</div></div>
          <div class="stat-tile"><div class="stat-value">4</div><div class="stat-label">ECG strips</div></div>
        </div>
        <div class="mt-9 border-t muted-border pt-6"><div class="text-sm font-extrabold mb-2">Session preferences</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><label class="checkrow"><input type="checkbox" id="shuffle-q" ${store.shuffleQuestions?'checked':''}/><span>Shuffle question order</span></label><label class="checkrow"><input type="checkbox" id="shuffle-a" ${store.shuffleAnswers?'checked':''}/><span>Shuffle answer choices</span></label></div>
        </div>
        <div class="flex flex-col sm:flex-row sm:items-center gap-4 mt-7"><button id="start-btn" class="btn btn-primary w-full sm:w-auto">Begin study session ${icons.arrow}</button><div class="text-xs softest-text">One question at a time · Immediate explanations · No timer</div></div>
      </div></section>`;
      document.getElementById('shuffle-q').addEventListener('change',e=>store.shuffleQuestions=e.target.checked);
      document.getElementById('shuffle-a').addEventListener('change',e=>store.shuffleAnswers=e.target.checked);
      document.getElementById('start-btn').addEventListener('click',()=>newSession());
    }
    function newSession(ids=null){
      store.order=(ids ? ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean) : (store.shuffleQuestions?shuffle(questions):[...questions]));
      store.mode=ids?'review':'full';store.cursor=0;store.results=new Map();store.selected=new Set();store.variants=new Map();
      for(const q of store.order)store.variants.set(q.id,store.shuffleAnswers?shuffle(q.options):q.options);
      renderQuestion();window.scrollTo({top:0,behavior:'instant'});
    }
    function renderQuestion(){
      const q=current();if(!q){renderResults();return;}
      const done=submitted(q);const choices=store.variants.get(q.id)||q.options;
      const total=store.order.length;const progress=Math.round((solved()/total)*100);
      app.innerHTML=`<section class="transition-in">
        <div class="flex flex-wrap items-start justify-between gap-3 mb-5"><div><div class="micro mb-1">${store.mode==='review'?'FOCUSED REVIEW':'CHAPTER 28 · DYSRHYTHMIAS'}</div><h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Study session</h1></div><div class="pill" aria-live="polite"><span aria-hidden="true">✦</span> ${score()} correct <span class="softest-text">/</span> ${solved()} answered</div></div>
        <div class="flex justify-between items-center gap-3 mb-2 text-sm"><span class="soft-text font-semibold">Question ${store.cursor+1} of ${total}</span><span class="softest-text font-semibold">${progress}% completed</span></div>
        <div class="progress-track mb-5" role="progressbar" aria-label="Quiz progress" aria-valuenow="${solved()}" aria-valuemin="0" aria-valuemax="${total}"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="panel question-panel">
          <div class="flex flex-wrap items-center gap-2 mb-5"><span class="type-chip">${q.type==='multi'?'☷  SELECT ALL THAT APPLY':'◉  SINGLE BEST ANSWER'}</span><span class="softest-text text-xs font-semibold">SOURCE · PAGE ${q.sourcePage}</span></div>
          <h2 class="question-title">${escaped(q.stem)}</h2>
          ${q.image?`<figure class="ecg-card"><img src="${q.image}" alt="ECG rhythm strip supplied for question ${q.id}"/><figcaption class="ecg-caption">Original ECG strip · Source question ${q.id}</figcaption></figure>`:''}
          ${q.id===22?table():''}
          <div class="mt-7"><div class="text-xs font-extrabold uppercase tracking-widest softest-text mb-1">${q.type==='multi'?'Select every applicable answer':'Select one best answer'}</div>
          <div id="choices" role="group" aria-label="Answer choices">${choices.map(o=>choiceHtml(q,o,done)).join('')}</div></div>
          ${!done?`<div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3 mt-7"><span class="text-xs softest-text">${q.type==='multi'?'Select all answers, then check the complete set.':'Choose one answer, then check your response.'}</span><button class="btn btn-primary w-full sm:w-auto" id="check-btn" ${store.selected.size===0?'disabled':''}>Check answer ${icons.arrow}</button></div>`:''}
          ${done?feedbackHtml(q,done):''}
        </div>
        <div class="mt-5 panel p-4 sm:p-6"><div class="flex justify-between items-center mb-3"><div class="text-xs font-extrabold uppercase tracking-widest softest-text">Question tracker</div><div class="text-xs softest-text">${solved()} of ${total} complete</div></div>${renderChips()}</div>
      </section>`;
      if(!done){
        document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>choose(q,b.dataset.option)));
        document.getElementById('check-btn').addEventListener('click',()=>submit(q));
        refreshSelections(q);
      }else{
        document.getElementById('next-btn').addEventListener('click',()=>{store.cursor++;store.selected=new Set();if(store.cursor>=store.order.length){renderResults();}else{renderQuestion()}window.scrollTo({top:0,behavior:'instant'});});
      }
    }
    function choiceHtml(q,o,done){
      const selected=done?done.answers.includes(o.id):store.selected.has(o.id);
      const isKey=q.correct.includes(o.id);
      const cls=done?(isKey?'is-correct':selected?'is-incorrect':''):(selected?'is-selected':'');
      const marker=done?(isKey?'✓':selected?'×':''):selected?'✓':'';
      return `<button type="button" class="choice ${cls}" data-option="${o.id}" role="${q.type==='multi'?'checkbox':'radio'}" aria-checked="${selected?'true':'false'}" ${done?'disabled':''}><span class="letter">${o.id}</span><span class="choice-text">${escaped(o.text)}</span><span class="status-mark" aria-hidden="true">${marker}</span></button>`;
    }
    function choose(q,id){
      if(submitted(q))return;
      if(q.type==='single'){store.selected=new Set([id]);}else{if(store.selected.has(id))store.selected.delete(id);else store.selected.add(id);}
      refreshSelections(q);
    }
    function refreshSelections(q){
      document.querySelectorAll('[data-option]').forEach(el=>{const yes=store.selected.has(el.dataset.option);el.classList.toggle('is-selected',yes);el.setAttribute('aria-checked',String(yes));el.querySelector('.status-mark').textContent=yes?'✓':'';});
      const checkBtn=document.getElementById('check-btn');if(checkBtn)checkBtn.disabled=store.selected.size===0;
    }
    function submit(q){
      if(store.selected.size===0||submitted(q))return;
      const answers=[...store.selected];const correct=answers.length===q.correct.length&&q.correct.every(id=>store.selected.has(id));
      store.results.set(q.id,{correct,answers});
      renderQuestion();document.getElementById('feedback-heading')?.focus({preventScroll:true});
    }
    function feedbackHtml(q,record){
      const actual=q.correct.map(id=>`${id}. ${(q.options.find(o=>o.id===id)||{}).text||''}`);
      const isLast=store.cursor===store.order.length-1;
      return `<div class="feedback ${record.correct?'':'wrong'}" id="feedback-area" role="status">
          <div class="flex items-center gap-3"><div class="rounded-full flex items-center justify-center shrink-0" style="width:34px;height:34px;background:${record.correct?'#265e4d':'#874358'};color:#fff">${record.correct?icons.check:icons.x}</div><div><h3 tabindex="-1" id="feedback-heading" class="feedback-title">${record.correct?'Correct — well done.':'Not quite — here’s why.'}</h3><div class="answer-note"><strong>Correct answer${q.correct.length>1?'s':''}:</strong> ${escaped(q.correct.join(', '))}</div></div></div>
          <div class="mt-5 pt-5 border-t muted-border"><div class="micro">Answer rationale</div><p class="rationale">${escaped(q.rationale)}</p></div>
          <details class="mt-4 text-sm"><summary class="cursor-pointer soft-text font-semibold">Show the full correct answer${q.correct.length>1?' set':''}</summary><ul class="pl-5 mt-2 soft-text list-disc space-y-1">${actual.map(a=>`<li>${escaped(a)}</li>`).join('')}</ul></details>
        </div><div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mt-6"><div class="text-sm soft-text"><strong style="color:#e6f5fc">Score: ${score()} / ${solved()}</strong> <span class="softest-text">· ${solved()-score()} missed</span></div><button id="next-btn" class="btn btn-primary w-full sm:w-auto">${isLast?'View final results':'Next question'} ${icons.arrow}</button></div>`;
    }
    function renderResults(){
      const correct=score(),total=store.order.length,percent=total?Math.round(correct/total*100):0;
      const wrong=store.order.filter(q=>!submitted(q)?.correct).map(q=>q.id);store.finishedWrong=[...wrong];
      const remark=percent===100?'Perfect round.':percent>=80?'Strong work.':percent>=60?'Great foundation.':'Keep building your rhythm recognition.';
      app.innerHTML=`<section class="panel p-6 sm:p-12 text-center transition-in"><div class="micro mb-5">${store.mode==='review'?'REVIEW COMPLETE':'STUDY SESSION COMPLETE'}</div><div class="result-ring" style="--percent:${percent}%"><div class="ring-inner"><div class="ring-score">${percent}%</div><div class="ring-label">ACCURACY</div></div></div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2">${remark}</h1><p class="soft-text mb-8">You worked through ${total} Chapter 28 question${total===1?'':'s'} in study mode.</p>
        <div class="grid grid-cols-3 gap-2 sm:gap-4 max-w-xl mx-auto text-left mb-8"><div class="stat-tile"><div class="stat-value">${correct}</div><div class="stat-label">Correct</div></div><div class="stat-tile"><div class="stat-value">${total-correct}</div><div class="stat-label">Missed</div></div><div class="stat-tile"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div></div>
        ${wrong.length?`<div class="max-w-xl mx-auto text-left p-5 rounded-2xl border muted-border mb-7" style="background:#102435"><div class="text-sm font-extrabold mb-3">Questions to revisit</div><div class="flex flex-wrap gap-2">${wrong.map(id=>`<span class="pill">Q${id}</span>`).join('')}</div><p class="softest-text text-xs mt-3">Review only the items you missed, with full rationales again.</p></div>`:'<p class="soft-text mb-7">Every answer matched the source key. Excellent!</p>'}
        <div class="flex flex-col sm:flex-row justify-center gap-3">${wrong.length?`<button id="review-btn" class="btn btn-primary">Review missed questions ${icons.arrow}</button>`:''}<button id="restart-btn" class="btn ${wrong.length?'btn-secondary':'btn-primary'}">Restart full quiz ${icons.arrow}</button></div>
      </section>`;
      document.getElementById('restart-btn').addEventListener('click',()=>{store.mode='full';startScreen();window.scrollTo({top:0,behavior:'instant'});});
      document.getElementById('review-btn')?.addEventListener('click',()=>newSession(wrong));
      window.scrollTo({top:0,behavior:'instant'});
    }
    document.addEventListener('keydown',event=>{
      if(!store.order.length||store.cursor>=store.order.length||!document.getElementById('choices')||submitted(current()))return;
      if(/^[1-6]$/.test(event.key)&&!event.altKey&&!event.metaKey&&!event.ctrlKey&&document.activeElement?.tagName!=='INPUT'){
        const opt=(store.variants.get(current().id)||current().options)[Number(event.key)-1];if(opt){choose(current(),opt.id);}
      }
    });
    // The complete original question bank and ECG images are embedded; this page makes no network requests.
    startScreen();
  })();
  </script>
</body>
</html>
